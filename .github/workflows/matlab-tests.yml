name: matlab-tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  tests:
    name: Python 3.12 wrapper tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov

      - name: Run gtwrap tests
        run: pytest -q

      - name: Run focused MATLAB wrapper tests
        run: pytest -q tests/test_matlab_wrapper.py
